<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 64 64">
  <title>Vellum Draw</title>
  <!-- Vellum family icon: the tile, folded vellum sheet, 2.4 strokes and amber points are shared with
       Vellum Plot; the ink-blue tile and the box, connector and circle glyph are Draw's.
       vellum-render's make_icon example renders it. -->
  <defs>
<linearGradient id="tile" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3A64CF"/><stop offset=".55" stop-color="#1E3A8A"/><stop offset="1" stop-color="#13286A"/></linearGradient>
<linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF" stop-opacity=".22"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></linearGradient>
<linearGradient id="sheet" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#DCE5F0"/></linearGradient>
<linearGradient id="fold" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#9FB0C8"/><stop offset="1" stop-color="#D3DDEA"/></linearGradient>
<linearGradient id="tint" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2F5BD0" stop-opacity=".30"/><stop offset="1" stop-color="#2F5BD0" stop-opacity=".06"/></linearGradient>
<linearGradient id="ink" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#14286A"/><stop offset="1" stop-color="#2448A8"/></linearGradient>
<radialGradient id="dot" cx=".35" cy=".32" r=".75"><stop offset="0" stop-color="#FFE08A"/><stop offset=".5" stop-color="#F2A900"/><stop offset="1" stop-color="#C98300"/></radialGradient>
<linearGradient id="back" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#B4C8F2"/><stop offset="1" stop-color="#7F9EE0"/></linearGradient>
<filter id="lift" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="1.8" stdDeviation="1.6" flood-color="#081640" flood-opacity=".5"/></filter>
<filter id="pip" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="0" dy=".6" stdDeviation=".5" flood-color="#5A3A00" flood-opacity=".45"/></filter>
</defs><rect x="2" y="2" width="60" height="60" rx="14" fill="url(#tile)"/><path d="M16 2h32a14 14 0 0 1 14 14v6H2v-6A14 14 0 0 1 16 2z" fill="url(#gloss)"/><path d="M19 16h25l9 9v29H19z" fill="url(#back)" opacity=".9" filter="url(#lift)"/><path d="M14 12h26l10 10v30H14z" fill="url(#sheet)" filter="url(#lift)"/><path d="M40 22h10l-10-10z" fill="#1E3A8A" fill-opacity=".12"/><path d="M40 12v10h10" fill="url(#fold)"/><rect x="18.5" y="18.5" width="14" height="10.5" rx="1.6" fill="url(#tint)" stroke="url(#ink)" stroke-width="2.4"/><circle cx="39" cy="40.5" r="6" fill="url(#tint)" stroke="url(#ink)" stroke-width="2.4"/><path d="M25.5 29v11.5H33" fill="none" stroke="url(#ink)" stroke-width="2.4" stroke-linejoin="round"/><circle cx="25.5" cy="29" r="2.7" fill="url(#dot)" filter="url(#pip)"/><circle cx="33" cy="40.5" r="2.7" fill="url(#dot)" filter="url(#pip)"/></svg>
