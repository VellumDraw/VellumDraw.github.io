<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 64 64">
  <title>Vellum Plot</title>
  <!-- Vellum family icon: the tile, folded vellum sheet, 2.4 strokes and amber points are shared with
       Vellum Draw; the teal tile and the axes + fit glyph are Plot's. tools/make_icon.py renders it. -->
  <defs>
<linearGradient id="tile" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1FA392"/><stop offset=".55" stop-color="#0E6B61"/><stop offset="1" stop-color="#084840"/></linearGradient>
<linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF" stop-opacity=".22"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></linearGradient>
<linearGradient id="sheet" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#D9E6EA"/></linearGradient>
<linearGradient id="fold" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#9FB4C2"/><stop offset="1" stop-color="#D3DEE6"/></linearGradient>
<linearGradient id="area" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#14907F" stop-opacity=".38"/><stop offset="1" stop-color="#14907F" stop-opacity=".04"/></linearGradient>
<linearGradient id="ink" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0B5A52"/><stop offset="1" stop-color="#11806F"/></linearGradient>
<radialGradient id="dot" cx=".35" cy=".32" r=".75"><stop offset="0" stop-color="#FFE08A"/><stop offset=".5" stop-color="#F2A900"/><stop offset="1" stop-color="#C98300"/></radialGradient>
<linearGradient id="back" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#A9DCD2"/><stop offset="1" stop-color="#6FBFB0"/></linearGradient>
<filter id="lift" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="1.8" stdDeviation="1.6" flood-color="#032E29" flood-opacity=".5"/></filter>
<filter id="lift2" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="3" stdDeviation="2.6" flood-color="#021F1B" flood-opacity=".55"/></filter>
<filter id="pip" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="0" dy=".6" stdDeviation=".5" flood-color="#5A3A00" flood-opacity=".45"/></filter>
</defs><rect x="2" y="2" width="60" height="60" rx="14" fill="url(#tile)"/><path d="M16 2h32a14 14 0 0 1 14 14v6H2v-6A14 14 0 0 1 16 2z" fill="url(#gloss)"/><path d="M19 16h25l9 9v29H19z" fill="url(#back)" opacity=".9" filter="url(#lift)"/><path d="M14 12h26l10 10v30H14z" fill="url(#sheet)" filter="url(#lift)"/><path d="M40 22h10l-10-10z" fill="#0E6B61" fill-opacity=".12"/><path d="M40 12v10h10" fill="url(#fold)"/><path d="M20 43C30 43 30 24 45.5 24V46H20z" fill="url(#area)"/><path d="M19 17v29h27" fill="none" stroke="#0A4A43" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M20 43C30 43 30 24 45.5 24" fill="none" stroke="url(#ink)" stroke-width="2.6" stroke-linecap="round"/><circle cx="23.4" cy="38.3" r="2.7" fill="url(#dot)" filter="url(#pip)"/><circle cx="33.6" cy="35.5" r="2.7" fill="url(#dot)" filter="url(#pip)"/><circle cx="37.2" cy="22.8" r="2.7" fill="url(#dot)" filter="url(#pip)"/></svg>
